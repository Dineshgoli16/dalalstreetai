name: Refresh Market Snapshot

on:
  schedule:
    # Runs Monday-Friday at 10:30 UTC (4:00 PM IST - Market Close)
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install yfinance
        
      - name: Generate Market Snapshot
        run: python build_snapshot.py
        
      - name: Commit and Push Snapshot
        run: |
          git config user.name "Market Sync Bot"
          git config user.email "bot@dalalstreetai.local"
          git add market_snapshot.json docs/market_snapshot.json market_snapshot.js docs/market_snapshot.js
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-refresh market data snapshot [skip ci]"
          git push
